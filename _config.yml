# ---------------------------------------------------------------------------
# 사이트 기본 정보 — 이 블록만 고쳐도 사이트 전체에 반영됩니다.
# ---------------------------------------------------------------------------
title: "Data Center Deep Dive"
tagline_ko: "Computing Architecture · Data Center · HPC · Server · Networking · AI/LLM"
tagline_en: "Computing Architecture · Data Center · HPC · Server · Networking · AI/LLM"
description: "Computing architecture, data centers, HPC, servers, networking, and AI/LLM infrastructure."
author: "ssyrc"
url: "https://ssyrc.github.io"
baseurl: ""
lang: ko            # 기본 언어 (한국어 사이트가 루트 /)

# 지금은 화면에 링크로 표시되지 않습니다. 나중에 소개 페이지 등에
# {{ site.github_username }} 형태로 불러 쓸 수 있게 값만 남겨둡니다.
github_username: ssyrc
email:

# ---------------------------------------------------------------------------
# 빌드 설정 — 바꿀 일이 거의 없습니다.
# ---------------------------------------------------------------------------
markdown: kramdown
highlighter: rouge
permalink: /:year/:month/:day/:title/
timezone: Asia/Seoul
excerpt_separator: "<!--more-->"

kramdown:
  input: GFM
  syntax_highlighter: rouge
  syntax_highlighter_opts:
    block:
      line_numbers: false

plugins:
  - jekyll-feed
  - jekyll-seo-tag
  - jekyll-sitemap

feed:
  path: feed.xml

sass:
  style: compressed

exclude:
  - Gemfile
  - Gemfile.lock
  - README.md
  - WRITING.md
  - CLAUDE.md
  - vendor
  - .github
  - _templates
  - tools
  - assets/images/README.md
  - assets/fonts/README.md

# ---------------------------------------------------------------------------
# 글 기본값 — _posts/ko 아래 글은 한국어, _posts/en 아래 글은 영어로 자동 분류.
# ---------------------------------------------------------------------------
defaults:
  - scope:
      path: ""
      type: posts
    values:
      layout: post
  - scope:
      path: "_posts/ko"
      type: posts
    values:
      lang: ko
      permalink: /ko/:year/:month/:day/:title/
  - scope:
      path: "_posts/en"
      type: posts
    values:
      lang: en
      permalink: /en/:year/:month/:day/:title/
  # 초안도 발행 글과 같은 규칙을 따르게 해서, _posts 로 옮길 때 달라지는 게 없도록 합니다.
  - scope:
      path: "_drafts/ko"
      type: posts
    values:
      lang: ko
      permalink: /ko/:year/:month/:day/:title/
  - scope:
      path: "_drafts/en"
      type: posts
    values:
      lang: en
      permalink: /en/:year/:month/:day/:title/
