  desc_en: "Data center topology, switching, traffic flow."

- key: power-cooling
  ko: "전력·냉각"
  en: "Power & Cooling"
  desc_ko: "전력 분배, 발열과 냉각, PUE 같은 효율 지표."
  desc_en: "Power distribution, heat and cooling, efficiency metrics such as PUE."

- key: ai-infra
  ko: "AI·HPC 인프라"
  en: "AI & HPC Infrastructure"
