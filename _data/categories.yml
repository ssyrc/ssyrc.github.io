# 글의 category 값과 여기 key 를 맞추면 목록·배지에 이름이 붙습니다.
# 주제를 추가하고 싶으면 항목을 하나 더 넣기만 하면 됩니다.
- key: cs
  ko: "CS 기초"
  en: "CS Fundamentals"
  desc_ko: "운영체제, 네트워크 이론, 컴퓨터 구조 같은 바탕이 되는 개념."
  desc_en: "Operating systems, networking theory, computer architecture."

- key: server
